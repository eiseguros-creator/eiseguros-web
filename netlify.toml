# Configuración de publicación en Netlify.
# Sólo se publica la carpeta "public": docs/, archivo/ y content/ quedan fuera del sitio.

[build]
  publish = "public"
  # Convierte las publicaciones de content/tips/ en assets/data/posts.json
  command = "node build-posts.mjs"

[build.environment]
  NODE_VERSION = "20"

# Encabezados de seguridad básicos.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Los paneles de administración no deben aparecer en buscadores.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/editor.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
