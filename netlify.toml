# Configuración de publicación en Netlify.
# Sólo se publica la carpeta "public": docs/ y archivo/ quedan fuera del sitio.

[build]
  publish = "public"

# El sitio es HTML estático, no requiere compilación.
[build.environment]
  NODE_VERSION = "20"

# Encabezados de seguridad básicos.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# El panel de administración no debe aparecer en buscadores.
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
